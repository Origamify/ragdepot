[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdepot"
version = "0.0.1"
description = "Standalone hybrid RAG library: dense + BM25 search over per-scope sqlite indexes"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2",
    "fastembed>=0.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ragdepot = "ragdepot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
